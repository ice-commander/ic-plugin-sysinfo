[package]
name = "ic-sysinfo-dlg"
version = "0.1.0"
edition = "2021"
description = "Describes the system information window as a view document the host renders"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-plugin-api = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.29"
network-interface = "1.1.1"

[features]
default = ["export-abi"]
export-abi = []
